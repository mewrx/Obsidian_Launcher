[package]
name = "noctalia-obsidian"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "noctalia-obsidian"
path = "main.rs"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "unstable-locales"] }

[profile.release]
opt-level = 3
lto = true
strip = true
